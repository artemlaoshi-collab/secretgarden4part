<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Китайские слова: соотнеси и вспомни</title>
<style>
:root{--bg:#f3f1e6;--surf:#fbfaf3;--ink:#23301f;--mute:#6b7560;--line:#cfd3bd;--acc:#3f7d3a;--accbg:#dcebd2;--rose:#c4506b;--rosebg:#f6dbe2;--sel:#e9d9a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c14;--surf:#1f271d;--ink:#e8ecdc;--mute:#9aa58d;--line:#34402f;--acc:#8fcf7f;--accbg:#2a3f26;--rose:#f08aa2;--rosebg:#47262f;--sel:#4a4222}}
:root[data-theme="dark"]{--bg:#161c14;--surf:#1f271d;--ink:#e8ecdc;--mute:#9aa58d;--line:#34402f;--acc:#8fcf7f;--accbg:#2a3f26;--rose:#f08aa2;--rosebg:#47262f;--sel:#4a4222}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",Georgia,serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
.hero{position:relative;height:230px;margin:0 -16px 16px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:30% 50%;display:block}
.hero h1{position:absolute;left:16px;bottom:12px;margin:0;font-size:1.5rem;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7);max-width:80%}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button,.btn{font:inherit;font-family:system-ui,sans-serif;font-size:.95rem;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
.tabs button{flex:1}
.tabs button[aria-pressed="true"],.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sub{font-family:system-ui,sans-serif;font-size:.9rem;color:var(--mute);margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.it{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:12px;min-height:52px;cursor:pointer;transition:background .15s,transform .15s}
.it.zh{font-size:1.5rem;text-align:center}
.it.ru{font-family:system-ui,sans-serif;font-size:1rem}
.it.sel{background:var(--sel);border-color:var(--ink)}
.it.ok{background:var(--accbg);border-color:var(--acc);cursor:default}
.it.bad{background:var(--rosebg);border-color:var(--rose);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.it{animation:none!important;transition:none}}
.done{margin-top:14px;padding:14px;border-radius:12px;background:var(--accbg);font-family:system-ui,sans-serif;text-align:center}
.card{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:28px 16px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .q{font-size:3.4rem;line-height:1.2}
.card .q.ru{font-family:system-ui,sans-serif;font-size:1.8rem}
.card .hint{font-family:system-ui,sans-serif;color:var(--mute);font-size:.9rem}
.card .ans{font-size:1.6rem;color:var(--acc)}
.card .py{font-family:system-ui,sans-serif;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.btn.no{border-color:var(--rose);color:var(--rose)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.hide{display:none}
</style>
</head>

<div class="tabs" role="tablist">
<button id="t1" aria-pressed="true">Игра 1. Соедини</button>
<button id="t2" aria-pressed="false">Игра 2. Вспомни</button>
</div>

<section id="g1">
<div class="tabs">
<button id="pa" aria-pressed="true">Часть А</button>
<button id="pb" aria-pressed="false">Часть Б</button>
</div>
<p class="sub">Нажми на слово, затем на его перевод. Порядок каждый раз новый.</p>
<div class="bar"><span id="score"></span><button class="btn" id="shuf">Перемешать заново</button></div>
<div class="cols"><div class="col" id="cl"></div><div class="col" id="cr"></div></div>
<div class="done hide" id="done"></div>
</section>

<section id="g2" class="hide">
<div id="setup">
<p class="sub">Слова появляются по одному: иероглиф или перевод. Вспомни ответ в голове, потом проверь себя.</p>
<div class="tabs">
<button data-set="A" aria-pressed="false">Часть А</button>
<button data-set="B" aria-pressed="false">Часть Б</button>
<button data-set="AB" aria-pressed="true">Все слова</button>
</div>
<button class="btn pri" id="start" style="width:100%">Начать</button>
</div>
<div id="play" class="hide">
<div class="bar"><span id="cnt"></span><button class="btn" id="stop">Закончить</button></div>
<div class="prog"><i id="pr"></i></div>
<div class="card" id="card"></div>
<div class="row" id="acts"></div>
</div>
</section>
</div>

<script>
const A=[["样子","yàngzi","вид, внешний вид"],["好像","hǎoxiàng","похоже, кажется"],["刚","gāng","только что"],["难过","nánguò","грустный"],["记住","jìzhù","помнить"],["总是","zǒngshì","сразу"],["一定","yídìng","обязательно"]];
const B=[["饿","è","голодный"],["渴","kě","жаждущий"],["应该","yīnggāi","должен, следует"],["笑","xiào","смеяться, улыбаться"],["关","guān","закрывать"],["别的","biéde","другие"],["让","ràng","позволять, заставлять"]];
const SETS={A,B};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* tabs */
function showGame(n){$("g1").classList.toggle("hide",n!=1);$("g2").classList.toggle("hide",n!=2);$("t1").setAttribute("aria-pressed",n==1);$("t2").setAttribute("aria-pressed",n==2)}
$("t1").onclick=()=>showGame(1);$("t2").onclick=()=>showGame(2);

/* game 1 */
let part="A",selL=null,selR=null,matched=0,tries=0,mistakes=0;
function build(){
  const w=SETS[part];matched=0;tries=0;mistakes=0;selL=selR=null;$("done").classList.add("hide");
  const L=$("cl"),R=$("cr");L.innerHTML="";R.innerHTML="";
  shuffle(w.map((x,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="it zh";b.textContent=w[i][0];b.dataset.i=i;b.onclick=()=>pick("L",b);L.appendChild(b)});
  shuffle(w.map((x,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="it ru";b.textContent=w[i][2];b.dataset.i=i;b.onclick=()=>pick("R",b);R.appendChild(b)});
  upd();
}
function upd(){$("score").textContent="Найдено: "+matched+" из "+SETS[part].length+" · ошибок: "+mistakes}
function pick(side,b){
  if(b.classList.contains("ok"))return;
  if(side=="L"){if(selL)selL.classList.remove("sel");selL=b}else{if(selR)selR.classList.remove("sel");selR=b}
  b.classList.add("sel");
  if(selL&&selR){
    const l=selL,r=selR;selL=selR=null;
    if(l.dataset.i===r.dataset.i){[l,r].forEach(x=>{x.classList.remove("sel");x.classList.add("ok")});matched++;upd();
      if(matched==SETS[part].length){const d=$("done");d.classList.remove("hide");d.textContent=mistakes?"Готово! Ошибок: "+mistakes+". Перемешай и попробуй ещё раз.":"Отлично, без единой ошибки!"}}
    else{mistakes++;upd();[l,r].forEach(x=>{x.classList.remove("sel");x.classList.add("bad")});setTimeout(()=>[l,r].forEach(x=>x.classList.remove("bad")),500)}
  }
}
function setPart(p){part=p;$("pa").setAttribute("aria-pressed",p=="A");$("pb").setAttribute("aria-pressed",p=="B");build()}
$("pa").onclick=()=>setPart("A");$("pb").onclick=()=>setPart("B");$("shuf").onclick=build;

/* game 2 */
let pool="AB",queue=[],total=0,known=0,cur=null,missed=[];
document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{pool=b.dataset.set;document.querySelectorAll("[data-set]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("start").onclick=()=>{
  const words=pool=="AB"?A.concat(B):SETS[pool];
  queue=shuffle(words).map(w=>({w,zh:Math.random()<.5}));total=queue.length;known=0;missed=[];
  $("setup").classList.add("hide");$("play").classList.remove("hide");next();
};
$("stop").onclick=()=>{$("play").classList.add("hide");$("setup").classList.remove("hide")};
function btn(txt,cls,fn){const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=txt;b.onclick=fn;return b}
function next(){
  $("pr").style.width=(known/total*100)+"%";
  const acts=$("acts"),card=$("card");acts.innerHTML="";
  if(!queue.length){
    if(missed.length){queue=shuffle(missed);missed=[];}
  }
  if(!queue.length){
    $("cnt").textContent="Все "+total+" слов вспомнены";
    card.innerHTML='<div class="q">🌿</div><div class="ans">Отлично!</div><div class="hint">Ты вспомнила все слова.</div>';
    acts.appendChild(btn("Начать заново","pri",()=>$("start").click()));return;
  }
  cur=queue.shift();$("cnt").textContent="Осталось: "+(queue.length+1+missed.length);
  const w=cur.w;
  card.innerHTML=cur.zh?'<div class="q">'+w[0]+'</div><div class="hint">Вспомни перевод</div>':'<div class="q ru">'+w[2]+'</div><div class="hint">Вспомни иероглиф</div>';
  acts.appendChild(btn("Показать ответ","pri",reveal));
}
function reveal(){
  const w=cur.w,card=$("card"),acts=$("acts");acts.innerHTML="";
  card.insertAdjacentHTML("beforeend",cur.zh?'<div class="ans">'+w[2]+'</div><div class="py">'+w[1]+'</div>':'<div class="ans" style="font-size:3rem">'+w[0]+'</div><div class="py">'+w[1]+'</div>');
  acts.appendChild(btn("Не вспомнила","no",()=>{missed.push({w:cur.w,zh:!cur.zh});next()}));
  acts.appendChild(btn("Вспомнила","pri",()=>{known++;next()}));
}
build();
</script>
</body>
</html>
